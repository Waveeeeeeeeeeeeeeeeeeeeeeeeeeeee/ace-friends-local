events {}
http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 80;
    access_log off;
    client_max_body_size 30m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    location = /health { return 200 'ace-local-gateway'; }
    location ~ ^/(auth|database|dating|gis|ai|admin|notifies)/v1(?<api_path>/.*)$ {
      set $service $1;
      set $port 0;
      if ($service = database) { set $port 15000; }
      if ($service = auth) { set $port 15100; }
      if ($service = gis) { set $port 15200; }
      if ($service = dating) { set $port 15300; }
      if ($service = ai) { set $port 15400; }
      if ($service = notifies) { set $port 15500; }
      if ($service = admin) { set $port 15600; }
      proxy_pass http://$service:$port$api_path$is_args$args;
    }
    location / { return 404; }
  }
}
